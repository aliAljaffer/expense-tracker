# Human setup, once per repository: add an Actions secret named WIKI_TOKEN
# holding a token that can push to this repository's wiki. Nothing here creates it.

name: wiki

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
    steps:
      - name: Check for the token
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::WIKI_TOKEN is not set. Add a repository secret named WIKI_TOKEN with a token that can push to the wiki."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Publish docs to the wiki
        run: |
          set -euo pipefail
          wiki="$RUNNER_TEMP/expense-tracker.wiki"
          rm -rf "$wiki"
          if ! git clone --depth 1 "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki"; then
            echo "::error::Cannot clone the wiki. Open the Wiki tab and create one page, then rerun this workflow."
            exit 1
          fi

          cp docs/*.md "$wiki/"

          for page in docs/*.md; do
            name="$(basename "$page" .md)"
            text="$(awk '
              FNR == 1 { text = ""; stop = 0 }
              stop { next }
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*```/ { next }
              /^[[:space:]]*$/ { if (text != "") stop = 1; next }
              { text = (text == "" ? $0 : text " " $0) }
              END { print text }
            ' "$page")"
            printf -- '- [%s](%s): %s\n' "$name" "$name" "$text"
          done | LC_ALL=C sort > "$RUNNER_TEMP/links.md"

          {
            echo "# Expense Tracker wiki"
            echo
            echo "Generated from docs/ on every push to main. Edit the page in the repository, not here."
            echo
            cat "$RUNNER_TEMP/links.md"
          } > "$wiki/Home.md"

          cd "$wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/."
            exit 0
          fi
          git commit -m "Publish docs from ${GITHUB_SHA::7}"
          git push
