name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - cmd/e2e-fixturegen/**
      - .claude
      - playwright.config.ts
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - cmd/e2e-fixturegen/**
      - .claude
      - playwright.config.ts
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web

  unit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  design:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python3 .claude/scripts/validate_tokens.py web/design/tokens.json
      - run: python3 .claude/scripts/validate_contrast.py web/design/tokens.json
      - run: node .claude/scripts/build_tokens.mjs --in web/design/tokens.json --out web/design/theme.css --check
      - run: git diff --exit-code web/design/theme.css
      - run: python3 .claude/scripts/lint_hardcodes.py web/src
      - run: python3 .claude/scripts/check_no_emoji.py web/src
      - run: python3 .claude/scripts/lint_native_select.py web/src
      - run: node .claude/scripts/lint_intent.mjs web/src
      - run: python3 .claude/scripts/validate_theme_refs.py --theme web/design/theme.css --theme web/src/app/globals.css web/src

  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        working-directory: web
      - run: go run ./cmd/e2e-fixturegen
      - run: npx playwright test

  render-gates:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chrome
      - run: npm run build
        working-directory: web
      - name: Snapshot the pages against the fake API
        run: |
          node web/e2e/support/start-servers.mjs &
          SERVER_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/signin > /dev/null && break
            sleep 1
          done
          npm run snapshot --prefix web
          kill "$SERVER_PID"
      - name: Assert the snapshots exist
        run: |
          count=$(find web/test/snapshots -name '*.html' | wc -l)
          echo "snapshot files: $count"
          test "$count" -gt 0
      - name: Render gates
        env:
          DS_REQUIRE_BROWSER: "1"
        run: |
          for f in web/test/snapshots/*-light.html; do
            node .claude/scripts/verify_states.mjs "$f"
            node .claude/scripts/axe_audit.mjs "$f"
          done
          for f in web/test/snapshots/*-dark.html; do
            node .claude/scripts/verify_states.mjs "$f" --dark
            node .claude/scripts/axe_audit.mjs "$f" --dark
          done
          node .claude/scripts/verify_overflow.mjs web/test/snapshots
          node .claude/scripts/slop_tells.mjs --strict web/test/snapshots/*.html
          node .claude/scripts/verify_target_size.mjs web/test/snapshots
          node .claude/scripts/verify_mobile_first.mjs web/test/snapshots
          node .claude/scripts/verify_responsive.mjs web/test/snapshots
          node .claude/scripts/lint_intent.mjs web/test/snapshots
          python3 .claude/scripts/lint_hardcodes.py web/src
          python3 .claude/scripts/check_no_emoji.py web/src
          python3 .claude/scripts/lint_native_select.py web/src

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, unit, build, design, e2e, render-gates]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - name: Spell the image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
