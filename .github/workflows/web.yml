name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - cmd/e2e-fixturegen/**
      - .claude
      - playwright.config.ts
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - cmd/e2e-fixturegen/**
      - .claude
      - playwright.config.ts
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web

  unit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  design:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python3 .claude/scripts/validate_tokens.py web/design/tokens.json
      - run: python3 .claude/scripts/validate_contrast.py web/design/tokens.json
      - run: node .claude/scripts/build_tokens.mjs --in web/design/tokens.json --out web/design/theme.css --check
      - run: git diff --exit-code web/design/theme.css
      - run: python3 .claude/scripts/lint_hardcodes.py web/src
      - run: python3 .claude/scripts/check_no_emoji.py web/src
      - run: python3 .claude/scripts/lint_native_select.py web/src
      - run: node .claude/scripts/lint_intent.mjs web/src
      - run: python3 .claude/scripts/validate_theme_refs.py --theme web/design/theme.css --theme web/src/app/globals.css web/src

  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        working-directory: web
      - run: go run ./cmd/e2e-fixturegen
      - run: npx playwright test

  render-gates:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chrome
      - run: npm run build
        working-directory: web
      - name: Snapshot the pages against the fake API
        run: |
          node web/e2e/support/start-servers.mjs &
          SERVER_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/signin > /dev/null &&
              curl -sf http://127.0.0.1:8901/healthz > /dev/null && break
            sleep 1
          done
          npm run snapshot --prefix web
          kill "$SERVER_PID"
      - name: Assert the snapshots exist
        run: |
          count=$(find web/test/snapshots -name '*.html' | wc -l)
          echo "snapshot files: $count"
          test "$count" -gt 0
      - name: Render gates
        env:
          DS_REQUIRE_BROWSER: "1"
        run: |
          for f in web/test/snapshots/*-light.html; do
            node .claude/scripts/verify_states.mjs "$f"
            node .claude/scripts/axe_audit.mjs "$f"
          done
          for f in web/test/snapshots/*-dark.html; do
            node .claude/scripts/verify_states.mjs "$f" --dark
            node .claude/scripts/axe_audit.mjs "$f" --dark
          done
          node .claude/scripts/verify_overflow.mjs web/test/snapshots
          node .claude/scripts/slop_tells.mjs --strict web/test/snapshots/*.html
          node .claude/scripts/verify_target_size.mjs web/test/snapshots
          node .claude/scripts/verify_mobile_first.mjs web/test/snapshots
          node .claude/scripts/verify_responsive.mjs web/test/snapshots
          node .claude/scripts/lint_intent.mjs web/test/snapshots
          python3 .claude/scripts/lint_hardcodes.py web/src
          python3 .claude/scripts/check_no_emoji.py web/src
          python3 .claude/scripts/lint_native_select.py web/src
      - name: Upload the gate snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-snapshots
          path: web/test/snapshots
          retention-days: 7

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, unit, build, design, e2e, render-gates]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - name: Spell the image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  update-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: aliAljaffer
          repositories: homelab

      - name: Check out the homelab manifests
        uses: actions/checkout@v4
        with:
          repository: aliAljaffer/homelab
          token: ${{ steps.app-token.outputs.token }}
          path: homelab

      - name: Pin the grooszy web image digest
        working-directory: homelab
        env:
          WEB_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$WEB_DIGEST"
          sed -i -E "s|ghcr.io/alialjaffer/grooszy-web@sha256:[0-9a-f]{64}|ghcr.io/alialjaffer/grooszy-web@${WEB_DIGEST}|" kubernetes/apps/grooszy/web-deployment.yaml
          grep -q "ghcr.io/alialjaffer/grooszy-web@${WEB_DIGEST}" kubernetes/apps/grooszy/web-deployment.yaml
          if git diff --quiet; then
            echo "The grooszy web image is already pinned."
            exit 0
          fi
          git config user.name "grooszy-manifest-bot"
          git config user.email "grooszy-manifest-bot@users.noreply.github.com"
          git add kubernetes/apps/grooszy/web-deployment.yaml
          git commit -m "grooszy: pin web image for ${GITHUB_SHA:0:7}"
          for _ in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          exit 1
