name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - cmd/e2e-fixturegen/**
      - playwright.config.ts
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - cmd/e2e-fixturegen/**
      - playwright.config.ts
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: arc-runner-grooszy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner toolchain
        run: |
          node --version
          go version
          npx playwright --version

      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  typecheck:
    timeout-minutes: 15
    runs-on: arc-runner-grooszy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web

  unit:
    timeout-minutes: 15
    runs-on: arc-runner-grooszy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web

  build:
    timeout-minutes: 15
    runs-on: arc-runner-grooszy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    timeout-minutes: 30
    runs-on: arc-runner-grooszy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go run ./cmd/e2e-fixturegen
      - run: npx playwright test

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, unit, build, e2e]
    timeout-minutes: 30
    runs-on: arc-runner-grooszy
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Spell the image name in lowercase
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"
          echo "HARBOR_IMAGE=harbor.alialjaffer.com/mirror/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: harbor.alialjaffer.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
            ${{ env.HARBOR_IMAGE }}:${{ github.sha }}
            ${{ env.HARBOR_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  update-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    timeout-minutes: 10
    runs-on: arc-runner-grooszy
    permissions:
      contents: read
    steps:
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: aliAljaffer
          repositories: homelab

      - name: Check out the homelab manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aliAljaffer/homelab
          token: ${{ steps.app-token.outputs.token }}
          path: homelab

      - name: Pin the grooszy web image digest
        working-directory: homelab
        env:
          WEB_DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Skipping: main moved to $latest."
            exit 0
          fi
          test -n "$WEB_DIGEST"
          sed -i -E "s#(ghcr\.io/alialjaffer|harbor\.alialjaffer\.com/mirror)/grooszy-web@sha256:[0-9a-f]{64}#harbor.alialjaffer.com/mirror/grooszy-web@${WEB_DIGEST}#" kubernetes/apps/grooszy/web-deployment.yaml
          grep -q "harbor.alialjaffer.com/mirror/grooszy-web@${WEB_DIGEST}" kubernetes/apps/grooszy/web-deployment.yaml
          if git diff --quiet; then
            echo "The grooszy web image is already pinned."
            exit 0
          fi
          git config user.name "grooszy-manifest-bot"
          git config user.email "grooszy-manifest-bot@users.noreply.github.com"
          git add kubernetes/apps/grooszy/web-deployment.yaml
          git commit -m "grooszy: pin web image for ${GITHUB_SHA:0:7}"
          for _ in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          exit 1
