name: Commit style

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  messages:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$HEAD_SHA~1..$HEAD_SHA"
          else
            range="$BASE..$HEAD_SHA"
          fi
          status=0
          for c in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$c" > /tmp/msg
            if ! scripts/check-commit-message.sh /tmp/msg; then
              echo "bad commit message in $c" >&2
              status=1
            fi
          done
          exit $status
